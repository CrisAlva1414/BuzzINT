version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buzzint-postgres
    environment:
      POSTGRES_DB:       buzzint
      POSTGRES_USER:     buzzint
      POSTGRES_PASSWORD: buzzint
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scraper/db/inits:/docker-entrypoint-initdb.d:ro 
    networks:
      - buzzint_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzzint -d buzzint"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  buzzint_net:
    driver: bridge
