version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mineduc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineduc_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-mineduc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ministerial_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mineduc_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineduc-scraper
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mineduc_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-mineduc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FERNET_KEY: ${FERNET_KEY}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ministerial_net
    command: uvicorn scraper.api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
    driver: local

networks:
  ministerial_net:
    driver: bridge
